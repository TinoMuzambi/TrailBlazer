name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - name: Parse application source
        run: Rscript -e 'parse(file = "MZMTIN002.R")'
      - name: Validate synthetic fixture
        run: |
          test -s data/example-runs.csv
          test "$(head -1 data/example-runs.csv)" = "date,time,lat,lng,elevation"
          test "$(wc -l < data/example-runs.csv)" -gt 3
      - name: Check documentation
        run: |
          test -s README.md
          test -s LICENSE
